name: Verify Kimai Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v2.71.0
permissions:
  contents: read
concurrency:
  group: kimai-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.kimai-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.kimai', info['package']
              assert info['name'] == 'Kimai', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'AGPL-3.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              m = yaml.safe_load(package.extractfile('manifest.yml').read())
              app = m['application']
              assert app['subdomain'] == 'kimai', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and u['backend'] == 'http://kimai:80/' for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'kimai', 'db'}, set(svcs)

              appsvc = svcs['kimai']
              assert 'kimai/kimai2' in appsvc['image'], appsvc['image']
              assert appsvc['image'].endswith(':' + tag.lstrip('v')), appsvc['image']

              env = ' '.join(appsvc['environment'])
              # single DSN, not discrete DB_* variables
              assert 'DATABASE_URL=mysql://' in env, env
              assert 'serverVersion=10.11' in env, env
              assert 'ADMINMAIL=' in env
              assert 'ADMINPASS=' in env
              assert 'stable_secret' in env, env
              # no hardcoded credential may survive
              assert 'ADMINPASS=admin' not in env
              assert 'ChangeMe' not in env

              db = svcs['db']
              assert 'mariadb:10.11' in db['image'], db['image']
              assert 'healthcheck' in db
              assert 'stable_secret' in ' '.join(db['environment'])
              assert any(b.endswith(':/var/lib/mysql') for b in db['binds']), db['binds']

              # app data must persist under /lzcapp/var
              assert any('/lzcapp/var/kimai:/opt/kimai/var' == b for b in appsvc['binds']), appsvc['binds']

              # no startup gate / file interceptor
              assert 'healthcheck' not in appsvc, appsvc
              text = package.extractfile('manifest.yml').read().decode()
              assert 'lzc-file-chooser' not in text

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {p['id']: p for p in params['params']}
              assert set(by_id) == {'admin_password'}, set(by_id)
              assert by_id['admin_password']['type'] == 'secret'
              assert by_id['admin_password']['optional'] is False

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  license_text = content.extractfile(lic[0]).read().decode()
              assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
